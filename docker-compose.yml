services:
  postgres:
    image: postgres:16
    container_name: higherpays-pg
    environment:
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: higherpays
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
